name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Reminder Me APK
    runs-on: ubuntu-latest

    env:
      CAPACITOR_TELEMETRY: 'false'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Make Gradlew Executable & Setup Android SDK 35
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || true
          cd ..
          echo "### Gradle Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### All files in android/app/build" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find android/app/build -maxdepth 4 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          mkdir -p release-output
          find android -name "*.apk" -exec cp -v {} release-output/ReminderMe.apk \;
          test -f release-output/ReminderMe.apk || exit 1
          ls -la release-output/

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminderMe-Android-APK
          path: release-output/ReminderMe.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: v2.0-apk
          name: "Reminder Me Android App"
          body_path: build.log
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
