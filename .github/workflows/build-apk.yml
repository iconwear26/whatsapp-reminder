name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Reminder Me APK
    runs-on: ubuntu-latest

    env:
      CAPACITOR_TELEMETRY: 'false'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Make Gradlew Executable & Setup Android SDK 35
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cd ..
          mkdir -p release-output
          find android -name "*.apk" -exec cp -v {} release-output/ReminderMe.apk \;
          test -f release-output/ReminderMe.apk || exit 1
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReminderMe-Android-APK
          path: release-output/ReminderMe.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: v2.0-apk
          name: "Reminder Me Android App (APK)"
          body: |
            ### 🌸 Reminder Me - Android APK Release

            Download `ReminderMe.apk` to install the native app directly on your phone.

            #### ✨ Highlights:
            - **Lock-Screen Alerts:** Native alarms ring on time even when phone is locked or app is closed.
            - **Local Notifications:** Triggered by Android OS AlarmManager.
            - **100% Free & Persistent:** No browser throttling.

            #### 📲 Installation:
            1. Tap `ReminderMe.apk` below to download.
            2. Tap the downloaded file and select **Install** (allow "Install unknown apps" if prompted).
            3. Open the app, grant notification permissions, and log in to your account!
          files: release-output/ReminderMe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
